# Blueprint Render — API SymbioNexus (NestJS + Prisma + PostgreSQL)
# Placé à la racine du dépôt pour que Render le détecte automatiquement (Blueprint).
services:
  - type: web
    name: symbionexus-api
    runtime: node
    plan: free
    rootDir: apps/api
    buildCommand: cd apps/api && npm install --legacy-peer-deps && npm run build
    startCommand: node dist/src/main.js
    healthCheckPath: /api/docs
    envVars:
      - key: DATABASE_URL          # URL PostgreSQL Neon
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: JWT_REFRESH_SECRET
        sync: false
      - key: FRONTEND_URL          # domaine Vercel (à remplir plus tard)
        sync: false
      - key: NODE_ENV
        value: production
