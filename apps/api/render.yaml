# Blueprint Render pour l'API SymbioNexus (NestJS + Prisma + PostgreSQL)
# Déploiement : Render → New → Blueprint, ou "New Web Service" en copiant ces réglages.
services:
  - type: web
    name: symbionexus-api
    runtime: node
    plan: free
    rootDir: apps/api
    # Installe, génère le client Prisma, pousse le schéma vers Postgres, compile
    buildCommand: npm install && npx prisma generate && npx prisma db push && npm run build
    startCommand: node dist/main
    healthCheckPath: /api/docs
    envVars:
      - key: DATABASE_URL          # URL PostgreSQL Neon (à coller dans le dashboard)
        sync: false
      - key: JWT_SECRET            # chaîne aléatoire longue
        sync: false
      - key: JWT_REFRESH_SECRET    # autre chaîne aléatoire longue
        sync: false
      - key: FRONTEND_URL          # domaine Vercel, ex. https://symbionexus.vercel.app
        sync: false
      - key: NODE_ENV
        value: production
